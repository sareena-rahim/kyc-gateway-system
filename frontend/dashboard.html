<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Gateway - Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text);
        }

        .navbar {
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .brand i {
            font-size: 28px;
            color: white;
        }

        .brand h2 {
            font-size: 30px;
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a.active,
        .nav-links a:hover {
            color: white;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 20px;
            color: white;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
        }

        .container {
            padding: 40px;
        }

        .hero {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 35px;
            border-radius: 24px;
            margin-bottom: 35px;
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.2);
        }

        .hero h1 {
            margin-bottom: 10px;
            font-size: 36px;
        }

        .hero p {
            opacity: 0.9;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .green { background: #dcfce7; color: #16a34a; }
        .blue { background: #dbeafe; color: #2563eb; }
        .red { background: #fee2e2; color: #dc2626; }

        .card h3 {
            color: var(--muted);
            font-size: 18px;
        }

        .card h2 {
            color: var(--primary);
            font-size: 48px;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="brand">
            <a href="index.html" class="brand">
                <i class="fas fa-shield-alt"></i>
                <h2>KYC Gateway</h2>
            </a>
        </div>

        <div class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="services.html">Services</a>
        </div>

        <div class="admin-profile">
            <i class="fas fa-bell"></i>
            <div class="avatar">A</div>
        </div>

    </nav>

    <div class="container">

        <div class="hero">
            <h1>Welcome back, Admin 👋</h1>
            <p>Monitor platform activity, service usage and client engagement.</p>
        </div>

        <div class="cards">

            <div class="card">
                <div class="card-header">
                    <h3>Total Clients</h3>
                    <div class="icon green">
                        <i class="fas fa-users"></i>
                    </div>
                </div>
                <h2>0</h2>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Total Requests</h3>
                    <div class="icon blue">
                        <i class="fas fa-chart-line"></i>
                    </div>
                </div>
                <h2>0</h2>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Total Credits</h3>
                    <div class="icon red">
                        <i class="fas fa-coins"></i>
                    </div>
                </div>
                <h2>100</h2>
            </div>

        </div>

    </div>

</body>
</html>
