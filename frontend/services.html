<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Gateway - Services</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text);
        }

        .navbar {
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand i {
            font-size: 28px;
        }

        .brand h2 {
            font-size: 30px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-weight: 600;
        }

        .nav-links a.active,
        .nav-links a:hover {
            color: white;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 20px;
            color: white;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: rgba(139, 123, 123, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
        }

        .container {
            padding: 40px;
        }

        .hero {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 35px;
            border-radius: 24px;
            margin-bottom: 35px;
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.2);
        }

        .hero h1 {
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }

        .card {
            background: var(--card);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .card h3 {
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            color: var(--muted);
        }

        .status {
            background: #dcfce7;
            color: #15803d;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #4b5563;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="brand">
            <a href="index.html" class="brand">
                <i class="fas fa-shield-alt"></i>
                <h2>KYC Gateway</h2>
            </a>
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="services.html" class="active">Services</a>
        </div>

        <div class="admin-profile">
            <i class="fas fa-bell"></i>
            <div class="avatar">A</div>
        </div>

    </nav>

    <div class="container">

        <div class="hero">
            <h1>Services ⚙️</h1>
            <p>Add and manage verification services for the KYC platform.</p>
        </div>

        <div class="grid">

            <div class="card">

                <h3>Available Services</h3>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Service Code</th>
                            <th>Display Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>PAN_FETCH</td>
                            <td>PAN Verification</td>
                            <td><span class="status">Active</span></td>
                        </tr>

                        <tr>
                            <td>2</td>
                            <td>AADHAAR_FETCH</td>
                            <td>Aadhaar Verification</td>
                            <td><span class="status">Active</span></td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <div class="card">

                <h3>Add New Service</h3>

                <label>Service Code</label>
                <input type="text" placeholder="e.g. PAN_FETCH">

                <label>Display Name</label>
                <input type="text" placeholder="e.g. PAN Verification">

                <button>Add Service</button>

            </div>

        </div>

    </div>

</body>
</html>
