<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Gateway - Admin Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: var(--card);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.15);
        }

        .brand-link {
            display: block;
            text-decoration: none;
        }

        .brand-link h1 {
            text-align: center;
            color: var(--text);
            font-size: 32px;
            margin-bottom: 8px;
        }

        .brand-link:hover .logo {
            transform: translateY(-2px);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 38px;
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.25);
            transition: transform 0.3s ease;
        }

        h1 {
            text-align: center;
            color: var(--text);
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 35px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px 16px 50px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: var(--muted);
            font-size: 14px;
        }

        .options a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.35);
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: var(--muted);
            font-size: 14px;
        }

        .footer-text span {
            color: var(--primary);
            font-weight: 600;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--muted);
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 16px;
        }

        .admin-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: fit-content;
            padding: 10px 18px;
            margin: 16px auto 0;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(37, 99, 235, 0.08);
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <a href="index.html" class="brand-link">

                <div class="logo">
                    <i class="fas fa-shield-alt"></i>
                </div>

                <h1>KYC Gateway</h1>

            </a>

            <p class="subtitle">
                Secure access to the Admin Panel
            </p>

            <form action="dashboard.html">

                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Username or Email" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    Sign In
                </button>

                <a href="login.html" class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    Back to User Portal
                </a>

            </form>

            <p class="footer-text">
                Secure verification platform for <span>Banks & NBFCs</span>
            </p>
        </div>
    </div>
</body>
</html>
